name: Palomar full preflight

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Reviewed full 40-character source commit
        required: true
        type: string
      request_id:
        description: Unique lowercase 12-character run identifier
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: mrklwk/zeta-density-39-over-17-lean
      commit: ${{ inputs.commit }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: ${{ inputs.request_id }}
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"authorization_relationship":"I have approval from a responsible author or maintainer","project_path":"lean","comparator_config_path":"lean/comparator.json","formalization_metadata_path":"lean/formalization.yaml"}'
