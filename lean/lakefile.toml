name = "math_collab"
version = "0.1.0"
defaultTargets = ["GuthMaynard", "Solution", "VerificationStatements"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "065356127b1dc0016f66b7283ce0ce2c4055aa55"

[[lean_lib]]
name = "MathCollab"
globs = ["MathCollab.+"]

[[lean_lib]]
name = "GuthMaynard"
globs = ["GuthMaynard.+"]
leanOptions = { autoImplicit = false }

[[lean_lib]]
name = "WeylPort"
globs = ["WeylPort.+"]
leanOptions = { autoImplicit = false }

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]

[[lean_lib]]
name = "VerificationStatements"
roots = ["VerificationStatements"]
