    "name": "Improved zero-density estimates for the Riemann zeta function",
    "description": "We prove improved zero-density estimates for the Riemann zeta function, strengthening our previously announced bounds in several ranges. Let N(σ,T) count the nontrivial zeros ρ with Re ρ ≥ σ and |Im ρ| ≤ T, counted with multiplicity. For T ≥ 2 and ε > 0, we obtain bounds of the form N(σ,T) ≤ C(σ,ε)T^((1−σ)A(σ)+ε). In particular, we may take A(σ)=12/(9σ−1) for 5/7 ≤ σ ≤ 113/153 and A(σ)=255/(153σ+7) for 113/153 ≤ σ ≤ 3/4. We also obtain a sequence of bounds for 7/9 < σ ≤ 7/8. The complete estimates and their ranges are given in an accompanying table and compared graphically with earlier bounds. The results are formalized in Lean.",
